<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ASCENDO — Elevate Yourself | Streetwear premium</title>
    <meta name="description" content="ASCENDO, streetwear premium minimaliste. Hoodies, t-shirts et pantalons en coton épais 380 g/m². Collection Automne-Hiver. Livraison offerte dès 80 €." />
    <meta name="theme-color" content="#0B1F3A" />
    <link rel="canonical" href="https://ascendo.fr/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / réseaux sociaux -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ASCENDO" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="ASCENDO — Elevate Yourself" />
    <meta property="og:description" content="Streetwear premium minimaliste. Collection Automne-Hiver disponible." />
    <meta property="og:url" content="https://ascendo.fr/" />
    <meta property="og:image" content="https://ascendo.fr/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Images du hero servies par Unsplash : connexion anticipée -->

    <!-- Données structurées : marque + site -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "ASCENDO",
            "url": "https://ascendo.fr/",
            "logo": "https://ascendo.fr/favicon.svg",
            "slogan": "Elevate Yourself",
            "sameAs": ["https://www.instagram.com/", "https://www.tiktok.com/"]
          },
          { "@type": "WebSite", "name": "ASCENDO", "url": "https://ascendo.fr/", "inLanguage": "fr-FR" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
